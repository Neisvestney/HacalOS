[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader-structs = {path = "../bootloader-structs"}
psf2 = { version = "0.4.0", features = [], default-features = false }
spin = "0.9.8"
volatile = "0.5.2"
x86_64 = "0.14.11"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
uart_16550 = "0.3.0"
pic8259 = "0.11.0"
