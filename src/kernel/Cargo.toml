[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader-structs = {path = "../bootloader-structs"}
inithfs = {path = "../inithfs"}
psf2 = { version = "0.4.0", features = [], default-features = false }
spin = "0.10.0"
x86_64 = "0.15.4"
uefi = { version = "0.26.0", features = [], default-features = false }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
uart_16550 = "0.4.0"
pic8259 = "0.11.0"
pc-keyboard = "0.8.0"
linked_list_allocator = "0.10.5"
libm = "0.2.8"
acpi = "5.2.0"
log = "0.4.29"
x2apic = "0.5.0"
ez_hpet = "1.0.0"
goblin = { version = "0.10.5", default-features = false, features = ["alloc", "elf64", "elf32", "endian_fd", "log"] }
volatile = "0.6.1"
